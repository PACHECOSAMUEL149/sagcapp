
<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAGC</title>

<style>

* { box-sizing: border-box; }

body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #ebf0f5; margin: 0; padding-bottom: 30px; }


header { background: #118a7e; color: white; padding: 16px; text-align: center; font-size: 20px; font-weight: bold; }


.container { max-width: 450px; margin: 20px auto; padding: 0 12px; }


.card-form, .card { background: white; border-radius: 12px; padding: 18px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }


.card-form h3 { color: #118a7e; margin: 0 0 15px 0; font-size: 18px; font-weight: bold; }


input, textarea { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #e1e5eb; border-radius: 8px; font-size: 14px; outline: none; background: #fafbfc; }

input:focus, textarea:focus { border-color: #118a7e; background: #fff; }


button.btn-publicar { width: 100%; padding: 12px; background: #118a7e; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; }


.card .data { font-size: 12px; color: #8e95a0; margin-bottom: 8px; }

.card h2 { margin: 0 0 12px 0; font-size: 18px; color: #000; font-weight: bold; }

.card img { width: 100%; border-radius: 12px; margin: 10px 0 15px 0; display: block; object-fit: cover; }

.card p { margin: 0 0 18px 0; font-size: 15px; color: #222; line-height: 1.4; }


/* BARRA DE BOTÕES ORGANIZADA */

.botoes-container { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid #f0f2f5; padding-top: 12px; width: 100%; }


.btn-acao { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8f9fa; border: 1px solid #e2e6ea; border-radius: 8px; padding: 8px 4px; cursor: pointer; color: #333; font-size: 12px; font-weight: 600; min-width: 0; }

.btn-acao:active { background: #e9ecef; }

.btn-acao.curtido { color: #e0245e; border-color: #f8d7da; background: #fdf2f4; }


.btn-acao .icone { font-size: 16px; margin-bottom: 2px; }


/* CAIXA DE COMENTÁRIOS */

.caixa-comentario { display: none; margin-top: 12px; border-top: 1px solid #eee; padding-top: 12px; }

.caixa-input { display: flex; gap: 8px; }

.caixa-input input { margin-bottom: 0; flex: 1; }

.caixa-input button { background: #118a7e; color: white; border: none; border-radius: 8px; padding: 0 15px; font-weight: bold; cursor: pointer; }

.comentario { background: #f1f3f5; padding: 8px 12px; border-radius: 10px; margin-top: 8px; font-size: 13px; color: #333; }

</style>

</head>

<body>


<header>SAGC</header>


<div class="container">


  <div class="card-form">

    <h3>Nova Publicação</h3>

    <input type="text" id="titulo" placeholder="Título da publicação...">

    <input type="text" id="imagem" placeholder="Nome da imagem na pasta (ex: foto1.jpg)">

    <textarea id="conteudo" placeholder="Escreva o texto do post..." rows="3"></textarea>

    <button type="button" class="btn-publicar" onclick="publicar()">Publicar</button>

  </div>


  <div id="feed"></div>


</div>


<script>

let posts = JSON.parse(localStorage.getItem('posts_sagc')) || [];

let likes = JSON.parse(localStorage.getItem('likes_sagc')) || {};

let meustatusLikes = JSON.parse(localStorage.getItem('status_likes_sagc')) || {};

let comentarios = JSON.parse(localStorage.getItem('com_sagc')) || {};


if(posts.length === 0){

  posts.push({id: 1, data: '03/08/2026', titulo: 'Publicação SAGC', imagem: 'foto1.jpg', conteudo: 'Esta é a primeira publicação de teste do aplicativo!'});

  likes[1] = 0;

  meustatusLikes[1] = false;

  comentarios[1] = [];

  salvar();

}


mostrar();


function salvar(){

  localStorage.setItem('posts_sagc', JSON.stringify(posts));

  localStorage.setItem('likes_sagc', JSON.stringify(likes));

  localStorage.setItem('status_likes_sagc', JSON.stringify(meustatusLikes));

  localStorage.setItem('com_sagc', JSON.stringify(comentarios));

}


function publicar(){

  let t = document.getElementById('titulo').value;

  let i = document.getElementById('imagem').value;

  let c = document.getElementById('conteudo').value;

  if(t === '' || c === ''){ alert('Preencha título e texto'); return; }


  let id = Date.now();

  posts.unshift({id: id, data: new Date().toLocaleDateString('pt-BR'), titulo: t, imagem: i, conteudo: c});

  likes[id] = 0;

  meustatusLikes[id] = false;

  comentarios[id] = [];

  salvar();


  document.getElementById('titulo').value = '';

  document.getElementById('imagem').value = '';

  document.getElementById('conteudo').value = '';

  mostrar();

}


function curtir(id){

  if(meustatusLikes[id]){

    likes[id] = Math.max(0, (likes[id] || 1) - 1);

    meustatusLikes[id] = false;

  } else {

    likes[id] = (likes[id] || 0) + 1;

    meustatusLikes[id] = true;

  }

  salvar();

  mostrar();

}


function toggleComentarios(id){

  let caixa = document.getElementById('caixa-' + id);

  caixa.style.display = (caixa.style.display === 'block') ? 'none' : 'block';

}


function comentar(id){

  let input = document.getElementById('input-comentario-' + id);

  let txt = input.value.trim();

  if(txt === '') return;


  if(!comentarios[id]) comentarios[id] = [];

  comentarios[id].push(txt);

  salvar();

  

  let lista = document.getElementById('lista-comentarios-' + id);

  lista.innerHTML += `<div class="comentario">${txt}</div>`;

  

  document.getElementById('txt-coment-' + id).innerText = `Comentar (${comentarios[id].length})`;

  input.value = '';

}


function compartilhar(id){

  let p = posts.find(item => item.id === id);

  if(!p) return;


  let textoParaCopiar = `${p.titulo}\n${p.conteudo}`;


  if (navigator.share && window.location.protocol.startsWith('https')) {

    navigator.share({

      title: p.titulo,

      text: textoParaCopiar,

      url: window.location.href

    }).catch(() => {});

  } else {

    if (navigator.clipboard && navigator.clipboard.writeText) {

      navigator.clipboard.writeText(textoParaCopiar).then(() => {

        alert('Texto copiado com sucesso!');

      }).catch(() => {

        prompt('Copie o texto do post abaixo:', textoParaCopiar);

      });

    } else {

      prompt('Copie o texto do post abaixo:', textoParaCopiar);

    }

  }

}


function mostrar(){

  let feed = document.getElementById('feed');

  feed.innerHTML = '';

  

  posts.forEach(p => {

    let comsHtml = '';

    if(comentarios[p.id]){

      comentarios[p.id].forEach(com => {

        comsHtml += `<div class="comentario">${com}</div>`;

      });

    }


    let qtdLikes = likes[p.id] || 0;

    let classeCurtido = meustatusLikes[p.id] ? 'curtido' : '';

    let qtdComentarios = comentarios[p.id] ? comentarios[p.id].length : 0;


    feed.innerHTML += `

    <div class="card">

      <div class="data">${p.data}</div>

      <h2>${p.titulo}</h2>

      ${p.imagem ? `<img src="${p.imagem}" onerror="this.style.display='none'">` : ''}

      <p>${p.conteudo}</p>


      <div class="botoes-container">

        <button type="button" class="btn-acao ${classeCurtido}" onclick="curtir(${p.id})">

          <span class="icone">${meustatusLikes[p.id] ? '❤️' : '🤍'}</span>

          <span>${qtdLikes}</span>

        </button>

        

        <button type="button" class="btn-acao" onclick="toggleComentarios(${p.id})">

          <span class="icone">💬</span>

          <span id="txt-coment-${p.id}">Comentar (${qtdComentarios})</span>

        </button>

        

        <button type="button" class="btn-acao" onclick="compartilhar(${p.id})">

          <span class="icone">📤</span>

          <span>Compartilhar</span>

        </button>

      </div>


      <div class="caixa-comentario" id="caixa-${p.id}">

        <div class="caixa-input">

          <input type="text" id="input-comentario-${p.id}" placeholder="Escreva um comentário...">

          <button type="button" onclick="comentar(${p.id})">Enviar</button>

        </div>

        <div id="lista-comentarios-${p.id}">${comsHtml}</div>

      </div>

    </div>`;

  });

}

</script>

</body>

</html>
