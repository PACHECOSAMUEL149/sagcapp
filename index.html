
<!DOCTYPE html>

<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SAGC</title>

<style>

*{box-sizing:border-box;margin:0;padding:0}

body{font-family:Arial,sans-serif;background:#121212;color:#fff;display:flex;justify-content:center;padding:10px}

.app-container{width:100%;max-width:380px}

.app-header{text-align:center;padding:10px;border-bottom:1px solid #2a2a2a;margin-bottom:10px}

.app-header h1{color:#25d366}

.post-card{background:#1e1e1e;padding:8px;border-radius:8px;margin-bottom:8px;border:1px solid #2a2a2a}

.post-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}

.perfil{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #25d366}

.nome{font-weight:bold}.data{font-size:11px;color:#999}

.post-imagem{width:100%;height:110px;object-fit:cover;border-radius:6px;margin:5px 0}

.post-conteudo{font-size:13px;color:#ccc;margin:6px 0}

.post-actions{display:flex;gap:4px;border-top:1px solid #2a2a2a;padding-top:6px}

.btn-action{flex:1;padding:6px;background:none;color:#bbb;border:none}

</style>

</head>

<body>

<div class="app-container">

<div class="app-header"><h1>SAGC</h1></div>

<div class="post-card">

<div class="post-header">

<img src="logo.png" class="perfil" onerror="this.style.display='none'">

<div><div class="nome">SAGC</div><div class="data">30/07/2026</div></div>

</div>

<h3>Publicação de Teste</h3>

<img src="foto1.jpg" class="post-imagem" onerror="this.style.display='none'">

<p class="post-conteudo">Seu novo layout compacto está funcionando.</p>

<div class="post-actions">

<button class="btn-action" onclick="curtir(this)">

❤️ <span>0</span>

</button>


<button class="btn-action" onclick="comentar()">

💬 Comentar

</button>


<button class="btn-action" onclick="compartilhar()">

📤 Compartilhar

</button>

</div>


<div id="comentarios" style="margin-top:10px;">

<div style="font-size:12px;color:#999;">

💬 <span id="totalComentarios">0</span> comentários

</div>

</div>


</div>

</div>
<script>

function curtir(botao){

    let span = botao.querySelector("span");

    let n = parseInt(span.innerText);


    if(botao.classList.contains("curtido")){

        botao.classList.remove("curtido");

        span.innerText = n - 1;

    }else{

        botao.classList.add("curtido");

        span.innerText = n + 1;

    }

}


function comentar(){


    let texto = prompt("Digite seu comentário:");


    if(!texto || texto.trim()=="") return;


    let area = document.getElementById("comentarios");


    let total = document.getElementById("totalComentarios");


    let comentario = document.createElement("div");


    comentario.style.background="#252525";

    comentario.style.padding="8px";

    comentario.style.marginTop="6px";

    comentario.style.borderRadius="6px";

    comentario.style.color="#fff";


    comentario.innerHTML =

    "<b>👤 Anônimo</b><br>"+texto;


    area.appendChild(comentario);


    total.innerText = parseInt(total.innerText)+1;

}


function compartilhar(){


    if(navigator.share){


        navigator.share({

            title:"SAGC",

            text:"Veja esta postagem!",

            url:location.href

        });


    }else if(navigator.clipboard){


        navigator.clipboard.writeText(location.href);


        alert("Link copiado!");


    }else{


        alert(location.href);


    }

}

</script>


</body></html>
