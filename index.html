
<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAGC</title>

<style>

body {font-family: Arial; background:#e9ebee; margin:0;}

header {background:#009688; color:white; padding:15px; text-align:center; font-size:22px; font-weight:bold;}

.container {max-width:500px; margin:15px auto; padding:0 10px;}

.card-form,.card {background:white; border-radius:8px; padding:15px; margin-bottom:15px; box-shadow:0 1px 2px rgba(0,0,0,.2);}

.card-form h3 {color:#009688; margin-top:0;}

input, textarea {width:100%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:5px; box-sizing:border-box;}

button {padding:10px; background:#009688; color:white; border:none; border-radius:5px; cursor:pointer; font-weight:bold;}

.btn-publicar {width:100%;}

.card.data {font-size:12px; color:#65676b;}

.card h2 {margin:10px 0 5px 0; font-size:18px;}

.card img {width:100%; border-radius:5px; margin:10px 0;}

.card p {margin:0 0 10px 0;}

.botoes {display:flex; gap:8px;}

.botoes button {flex:1; background:#f2f3f5; color:#4b4c4f; border:1px solid #ddd;}

.botoes button.curtido {color:#e0245e; border-color:#e0245e;}

.caixa-comentario {display:none; margin-top:10px; border-top:1px solid #eee; padding-top:10px;}

.caixa-comentario input {width:70%; display:inline-block;}

.caixa-comentario button {width:27%; display:inline-block;}

.comentario {background:#f2f3f5; padding:8px; border-radius:15px; margin-top:5px; font-size:14px;}

</style>

</head>

<body>

<header>SAGC</header>

<div class="container">


<div class="card-form">

<h3>Nova Publicação</h3>

<input type="text" id="titulo" placeholder="Título da publicação...">

<input type="text" id="imagem" placeholder="Nome da imagem na pasta ex: foto1.jpg">

<textarea id="conteudo" placeholder="Escreva o texto do post..." rows="3"></textarea>

<button type="button" class="btn-publicar" onclick="publicar()">Publicar</button>

</div>


<div id="feed"></div>


</div>


<script>

// Carrega dados salvos no navegador

let posts = JSON.parse(localStorage.getItem('posts_sagc')) || [];

let likes = JSON.parse(localStorage.getItem('likes_sagc')) || {};

let meustatusLikes = JSON.parse(localStorage.getItem('status_likes_sagc')) || {};

let comentarios = JSON.parse(localStorage.getItem('com_sagc')) || {};


// Post de exemplo inicial

if(posts.length === 0){

  posts.push({id: 1, data: '03/08/2026', titulo: 'Publicação SAGC', imagem: 'foto1.jpg', conteudo: 'Esta é a primeira publicação de teste do aplicativo!'});

  likes[1] = 0;

  meustatusLikes[1] = false;

  comentarios[1] = [];

  salvar();

}


mostrar();


function salvar(){

  localStorage.setItem('posts_sagc', JSON.stringify(posts));

  localStorage.setItem('likes_sagc', JSON.stringify(likes));

  localStorage.setItem('status_likes_sagc', JSON.stringify(meustatusLikes));

  localStorage.setItem('com_sagc', JSON.stringify(comentarios));

}


function publicar(){

  let t = document.getElementById('titulo').value;

  let i = document.getElementById('imagem').value;

  let c = document.getElementById('conteudo').value;

  if(t === '' || c === ''){ alert('Preencha título e texto'); return; }


  let id = Date.now();

  posts.unshift({id: id, data: new Date().toLocaleDateString('pt-BR'), titulo: t, imagem: i, conteudo: c});

  likes[id] = 0;

  meustatusLikes[id] = false;

  comentarios[id] = [];

  salvar();


  document.getElementById('titulo').value = '';

  document.getElementById('imagem').value = '';

  document.getElementById('conteudo').value = '';

  mostrar();

}


function curtir(id){

  if(meustatusLikes[id]){

    likes[id] = Math.max(0, (likes[id] || 1) - 1);

    meustatusLikes[id] = false;

  } else {

    likes[id] = (likes[id] || 0) + 1;

    meustatusLikes[id] = true;

  }

  salvar();

  mostrar();

}


function toggleComentarios(id){

  let caixa = document.getElementById('caixa-' + id);

  if(caixa.style.display === 'block'){

    caixa.style.display = 'none';

  } else {

    caixa.style.display = 'block';

  }

}


function comentar(id){

  let input = document.getElementById('input-comentario-' + id);

  let txt = input.value.trim();

  if(txt === '') return;


  if(!comentarios[id]) comentarios[id] = [];

  comentarios[id].push(txt);

  salvar();

  

  // Adiciona o comentário na tela na hora

  let lista = document.getElementById('lista-comentarios-' + id);

  lista.innerHTML += `<div class="comentario">${txt}</div>`;

  

  // Atualiza o contador do botão

  document.getElementById('btn-coment-' + id).innerText = `💬 Comentar (${comentarios[id].length})`;

  

  input.value = '';

}


function compartilhar(id){

  let p = posts.find(item => item.id === id);

  if(!p) return;


  let textoParaCopiar = `${p.titulo}\n${p.conteudo}`;


  // Tenta compartilhar pelo menu nativo se estiver rodando via HTTPS

  if (navigator.share && window.location.protocol.startsWith('https')) {

    navigator.share({

      title: p.titulo,

      text: textoParaCopiar,

      url: window.location.href

    }).catch(() => {});

  } else {

    // Se estiver no arquivo local ou sem HTTPS, copia o texto ou exibe a caixinha

    if (navigator.clipboard && navigator.clipboard.writeText) {

      navigator.clipboard.writeText(textoParaCopiar).then(() => {

        alert('Texto do post copiado! Agora é só colar onde quiser.');

      }).catch(() => {

        prompt('Copie o texto abaixo para compartilhar:', textoParaCopiar);

      });

    } else {

      prompt('Copie o texto abaixo para compartilhar:', textoParaCopiar);

    }

  }

}


function mostrar(){

  let feed = document.getElementById('feed');

  feed.innerHTML = '';

  

  posts.forEach(p => {

    let comsHtml = '';

    if(comentarios[p.id]){

      comentarios[p.id].forEach(com => {

        comsHtml += `<div class="comentario">${com}</div>`;

      });

    }


    let qtdLikes = likes[p.id] || 0;

    let classeCurtido = meustatusLikes[p.id] ? 'curtido' : '';

    let qtdComentarios = comentarios[p.id] ? comentarios[p.id].length : 0;


    feed.innerHTML += `

    <div class="card">

      <div class="data">${p.data}</div>

      <h2>${p.titulo}</h2>

      ${p.imagem ? `<img src="${p.imagem}" onerror="this.style.display='none'">` : ''}

      <p>${p.conteudo}</p>


      <div class="botoes">

        <button type="button" class="${classeCurtido}" onclick="curtir(${p.id})">

          ♥ Curtir (${qtdLikes})

        </button>

        <button type="button" id="btn-coment-${p.id}" onclick="toggleComentarios(${p.id})">

          💬 Comentar (${qtdComentarios})

        </button>

        <button type="button" onclick="compartilhar(${p.id})">

          🔗 Compartilhar

        </button>

      </div>


      <div class="caixa-comentario" id="caixa-${p.id}">

        <input type="text" id="input-comentario-${p.id}" placeholder="Escreva um comentário...">

        <button type="button" onclick="comentar(${p.id})">Enviar</button>

        <div id="lista-comentarios-${p.id}">${comsHtml}</div>

      </div>

    </div>`;

  });

}

</script>

</body>

</html>
