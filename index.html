
<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SAGC</title>

<style>

body{font-family:Arial,sans-serif;background:#eef2f7;margin:0}

header{position:sticky;top:0;background:#128c7e;color:#fff;padding:14px;text-align:center;font-weight:bold}

#feed{max-width:360px;margin:12px auto}

.card{background:#fff;border-radius:10px;padding:12px;box-shadow:0 2px 6px rgba(0,0,0,.12)}

img{display:block;margin:10px auto;max-width:280px;max-height:200px;width:auto;height:auto;border-radius:8px}

.actions{display:flex;gap:6px;margin-top:10px}

button{flex:1;padding:8px;border:1px solid #ccc;border-radius:5px;background:#f9f9f9;cursor:pointer}

button.curtido{color:#e0245e;border-color:#e0245e;background:#ffebee}


/* Estilo da caixa de comentários */

.comments-section{display:none;margin-top:10px;padding-top:8px;border-top:1px dashed #ccc}

.comment-input-box{display:flex;gap:4px;margin-bottom:6px}

.comment-input-box input{flex:1;padding:6px;border:1px solid #ccc;border-radius:4px;font-size:0.8em}

.comment-input-box button{flex:0;padding:6px 10px;background:#128c7e;color:#fff;border:none;border-radius:4px}

.comment-list{font-size:0.8em;color:#333}

.comment-item{background:#f0f2f5;padding:5px 8px;border-radius:4px;margin-bottom:4px}

</style>

</head>

<body>

<header>SAGC</header>

<div id="feed">

<div class="card">

<div>03/08/2026</div>

<h2>Publicação SAGC</h2>

<img src="foto1.jpg" onerror="this.style.display='none'">

<p>Substitua este conteúdo pelo seu posts.json ou adapte conforme necessário.</p>

<div class="actions">

<button id="btn-like" onclick="curtir()">❤️ <span id="likes-count">0</span></button>

<button onclick="toggleComentarios()">💬 Comentar</button>

<button onclick="compartilhar()">📤 Compartilhar</button>

</div>


<!-- Área de comentários -->

<div class="comments-section" id="comments-box">

<div class="comment-input-box">

<input type="text" id="input-comment" placeholder="Escreva um comentário...">

<button onclick="adicionarComentario()">Enviar</button>

</div>

<div class="comment-list" id="comment-list"></div>

</div>


</div>

</div>


<script>

function curtir() {

    const btn = document.getElementById('btn-like');

    const count = document.getElementById('likes-count');

    let total = parseInt(count.innerText);


    if (btn.classList.contains('curtido')) {

        btn.classList.remove('curtido');

        total--;

    } else {

        btn.classList.add('curtido');

        total++;

    }

    count.innerText = total;

}


function toggleComentarios() {

    const box = document.getElementById('comments-box');

    box.style.display = box.style.display === 'block' ? 'none' : 'block';

}


function adicionarComentario() {

    const input = document.getElementById('input-comment');

    const list = document.getElementById('comment-list');

    if (input.value.trim() === '') return;


    const item = document.createElement('div');

    item.className = 'comment-item';

    item.innerText = input.value;


    list.appendChild(item);

    input.value = '';

}


function compartilhar() {

    const url = window.location.href;

    

    // Tenta copiar usando o método tradicional

    const tempInput = document.createElement("input");

    document.body.appendChild(tempInput);

    tempInput.value = url;

    tempInput.select();

    document.execCommand("copy");

    document.body.removeChild(tempInput);


    // Exibe aviso visual na tela

    alert("Link copiado para a área de transferência:\n" + url);

}

</script>

</body>

</html>
