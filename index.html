<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAGC</title>

<style>

* { box-sizing: border-box; }

body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial; background: #ebf0f5; margin: 0; padding-bottom: 30px; }


header { background: #118a7e; color: white; padding: 16px; text-align: center; font-size: 20px; font-weight: bold; }


.menu { display: flex; justify-content: center; gap: 4px; background: #118a7e; padding: 0 8px 12px; overflow-x: auto; }

.menu button { background: rgba(255,255,255,0.18); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; padding: 8px 10px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }

.menu button.ativo { background: white; color: #118a7e; }


.container { max-width: 450px; margin: 20px auto; padding: 0 12px; }

.pagina { display: none; }

.pagina.ativa { display: block; }


.card,.produto,.sobre { background: white; border-radius: 12px; padding: 18px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }


.titulo-pagina { color: #118a7e; margin: 0 0 15px 0; font-size: 20px; font-weight: bold; }


input, textarea { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #e1e5eb; border-radius: 8px; font-size: 14px; background: #fafbfc; }


/* FEED POSTS */

.card .data { font-size: 12px; color: #8e95a0; margin-bottom: 8px; }

.card h2 { margin: 0 0 12px 0; font-size: 18px; color: #000; }

.card img { width: 100%; border-radius: 12px; margin: 10px 0; }

.card p { margin: 0 0 18px 0; font-size: 15px; color: #222; white-space: pre-wrap; }


/* PRODUTOS */

.produto img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }

.produto h3 { margin: 0 0 6px 0; font-size: 16px; color: #118a7e; }

.produto p { margin: 0 0 10px 0; font-size: 13px; color: #444; }

.produto .preco { color: #118a7e; font-size: 18px; font-weight: bold; margin-bottom: 12px; }


.botoes-container { display: flex; gap: 6px; border-top: 1px solid #f0f2f5; padding-top: 12px; }

.btn-acao { flex: 1; padding: 8px 4px; background: #f8f9fa; border: 1px solid #e2e6ea; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 4px; }

.btn-whatsapp { color: #128c7e; background: #e8f5e9; border-color: #c8e6c9; }


.caixa-comentario { display: none; margin-top: 12px; border-top: 1px solid #eee; padding-top: 12px; }

.caixa-input { display: flex; gap: 8px; }

.caixa-input button { background: #118a7e; color: white; border: none; border-radius: 8px; padding: 0 15px; font-weight: bold; }

.comentario { background: #f1f3f5; padding: 8px 12px; border-radius: 10px; margin-top: 8px; font-size: 13px; }

</style>

</head>

<body>


<header>SAGC</header>


<div class="menu">

  <button class="ativo" onclick="abrir('inicio', this)">🏠 Início</button>

  <button onclick="abrir('produtos', this)">🛒 Produtos</button>

  <button onclick="abrir('sobre', this)">ℹ️ Sobre</button>

</div>


<div class="container">


  <section id="inicio" class="pagina ativa">

    <div id="feed"></div>

  </section>


  <section id="produtos" class="pagina">

    <div class="card"><h2 class="titulo-pagina">🛒 Produtos</h2><p>Confira nossos produtos disponíveis:</p></div>

    <div id="listaProdutos"></div>

  </section>


  <section id="sobre" class="pagina">

    <div class="sobre"><h2 class="titulo-pagina">ℹ️ Sobre</h2><h3>SAGC</h3><p>Reúne notícias e produtos.</p></div>

  </section>


</div>


<script>

let TELEFONE_WHATS = "5538984191501"; // SEU NÚMERO COM DDD


let dados = { posts: [], produtos: [] };


try {

  dados = JSON.parse(localStorage.getItem('sagc_v3')) || dados;

} catch(e) {

  console.log("Resetando dados");

}


if(!dados.posts || dados.posts.length == 0){

  dados.posts = [{id:1, data:'08/08/2026', titulo:'Bem vindo ao SAGC', imagem:'', conteudo:'Agora sim está funcionando!', likes:0, coms:[]}];

}


if(!dados.produtos){

  dados.produtos = [];

}


function salvar(){

  localStorage.setItem('sagc_v3', JSON.stringify(dados));

}


function abrir(n,b){

  document.querySelectorAll('.pagina').forEach(p=>p.classList.remove('ativa'));

  document.getElementById(n).classList.add('ativa');

  document.querySelectorAll('.menu button').forEach(x=>x.classList.remove('ativo'));

  if(b) b.classList.add('ativo');

}


function curtir(id){

  let p = dados.posts.find(x=>x.id==id);

  p.likes = (p.likes||0) + 1;

  salvar(); mostrar();

}


function toggleCom(id){

  let x = document.getElementById('c'+id);

  x.style.display = x.style.display=='block'?'none':'block';

}


function comentar(id){

  let inp = document.getElementById('in'+id);

  if(inp.value.trim()=='') return;

  let p = dados.posts.find(x=>x.id==id);

  p.coms.push(inp.value);

  inp.value=''; salvar(); mostrar();

}


function compartilharWhats(id){

  let p = dados.posts.find(x=>x.id==id);

  if(!p) return;

  let mensagem = `*${p.titulo}*\n\n${p.conteudo}`;

  window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(mensagem)}`, '_blank');

}


function mostrar(){

  // MOSTRAR POSTS

  feed.innerHTML = dados.posts.map(p=>`

    <div class="card">

      <div class="data">${p.data}</div>

      <h2>${p.titulo}</h2>

      ${p.imagem?`<img src="${p.imagem}" onerror="this.style.display='none'">`:''}

      <p>${p.conteudo}</p>

      <div class="botoes-container">

        <button class="btn-acao" onclick="curtir(${p.id})">🤍 ${p.likes||0}</button>

        <button class="btn-acao" onclick="toggleCom(${p.id})">💬 ${p.coms.length}</button>

        <button class="btn-acao btn-whatsapp" onclick="compartilharWhats(${p.id})">📲 Whats</button>

      </div>

      <div class="caixa-comentario" id="c${p.id}">

        <div class="caixa-input">

          <input id="in${p.id}" placeholder="Escreva um comentário...">

          <button onclick="comentar(${p.id})">Enviar</button>

        </div>

        ${p.coms.map(c=>`<div class="comentario">${c}</div>`).join('')}

      </div>

    </div>

  `).join('');


  // MOSTRAR PRODUTOS

  if(dados.produtos.length == 0){

    listaProdutos.innerHTML = `<p style="text-align:center; color:#8e95a0;">Nenhum produto cadastrado no momento.</p>`;

  } else {

    listaProdutos.innerHTML = dados.produtos.map(pr=>`

      <div class="produto">

        ${pr.imagem ? `<img src="${pr.imagem}" onerror="this.style.display='none'">` : ''}

        <h3>${pr.nome}</h3>

        <p>${pr.desc || ''}</p>

        <div class="preco">R$ ${pr.preco}</div>

        <a href="https://wa.me/${TELEFONE_WHATS}?text=Olá!%20Tenho%20interesse%20no%20produto:%20${encodeURIComponent(pr.nome)}" target="_blank" style="display:inline-block; background:#25D366; color:white; padding:8px 12px; border-radius:6px; text-decoration:none; font-size:12px; font-weight:bold;">

          💬 Comprar pelo WhatsApp

        </a>

      </div>

    `).join('');

  }

}


mostrar();

</script>


</body>

</html>
