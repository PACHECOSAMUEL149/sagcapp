
<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SAGC</title>

<style>

body{font-family:Arial,sans-serif;background:#eef2f7;margin:0}

header{position:sticky;top:0;background:#128c7e;color:#fff;padding:14px;text-align:center;font-weight:bold;font-size:1.1em}

.container{max-width:480px;margin:12px auto;padding:0 12px}

.card-form{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 6px rgba(0,0,0,.1);margin-bottom:16px}

.card-form h3{color:#128c7e;margin:0 0 14px}

.card-form input,.card-form textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;margin-bottom:10px;box-sizing:border-box}

.card-form button{width:100%;padding:12px;background:#128c7e;color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer}

.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 6px rgba(0,0,0,.1);margin-bottom:12px}

.card .data{font-size:0.8em;color:#666}

.card h2{margin:8px 0;font-size:1.1em}

img{width:100%;border-radius:8px;margin:10px 0}

.card p{margin:10px 0;font-size:0.9em}

.actions{display:flex;gap:8px;margin-top:12px}

.actions button{flex:1;padding:8px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;font-size:0.85em}

.actions button.curtido{color:#e0245e;border-color:#e0245e}

.comments{margin-top:10px;border-top:1px solid #eee;padding-top:10px}

.comments input{width:70%;padding:8px;border:1px solid #ddd;border-radius:20px}

.comments button{padding:8px 12px;background:#128c7e;color:#fff;border:none;border-radius:20px;margin-left:4px}

.comment{background:#f0f2f5;padding:6px 10px;border-radius:12px;margin-top:5px;font-size:0.85em}

</style>

</head>

<body>

<header>SAGC</header>

<div class="container">


    <div class="card-form">

        <h3>Nova Publicação</h3>

        <input type="text" id="titulo" placeholder="Título da publicação...">

        <input type="text" id="imagem" placeholder="Nome da imagem na pasta (ex: foto1.jpg)">

        <textarea id="conteudo" placeholder="Escreva o texto do post..." rows="3"></textarea>

        <button onclick="publicar()">Publicar</button>

    </div>


    <div id="feed"></div>

</div>


<script>

// Pega tudo do navegador

let posts = JSON.parse(localStorage.getItem('posts')) || [];

let dados = JSON.parse(localStorage.getItem('dados')) || {};


// Se for a primeira vez, cria 1 post de exemplo

if(posts.length === 0){

    posts = [{

        id: '1', data: "03/08/2026", titulo: "Publicação SAGC", 

        imagem: "foto1.jpg", conteudo: "Esta é a primeira publicação de teste do aplicativo!"

    }];

    salvar();

}

mostrar();


function salvar(){

    localStorage.setItem('posts', JSON.stringify(posts));

    localStorage.setItem('dados', JSON.stringify(dados));

}


function publicar(){

    let t = document.getElementById('titulo').value;

    let i = document.getElementById('imagem').value;

    let c = document.getElementById('conteudo').value;

    if(!t || !c){ alert('Preencha título e texto'); return; }

    

    let novo = {id: Date.now().toString(), data: new Date().toLocaleDateString('pt-BR'), titulo:t, imagem:i, conteudo:c};

    posts.unshift(novo);

    salvar();

    document.getElementById('titulo').value = '';

    document.getElementById('imagem').value = '';

    document.getElementById('conteudo').value = '';

    mostrar();

}


function mostrar(){

    let feed = document.getElementById('feed');

    feed.innerHTML = '';

    posts.forEach(post => {

        if(!dados[post.id]) dados[post.id] = {likes:0, comentarios:[]};

        

        let html = `

        <div class="card">

            <div class="data">${post.data}</div>

            <h2>${post.titulo}</h2>

            ${post.imagem ? `<img src="${post.imagem}" onerror="this.style.display='none'">` : ''}

            <p>${post.conteudo}</p>

            <div class="actions">

                <button class="${dados[post.id].curtiu ? 'curtido' : ''}" onclick="curtir('${post.id}')">❤️ ${dados[post.id].likes}</button>

                <button onclick="document.getElementById('c${post.id}').style.display = document.getElementById('c${post.id}').style.display=='none'?'block':'none'">💬 Comentar</button>

                <button onclick="compartilhar('${post.titulo}')">📤 Compartilhar</button>

            </div>

            <div class="comments" id="c${post.id}" style="display:none">

                <input id="in${post.id}" placeholder="Escreva um comentário...">

                <button onclick="comentar('${post.id}')">Enviar</button>

                <div id="lista${post.id}"></div>

            </div>

        </div>`;

        feed.innerHTML += html;

        mostrarComentarios(post.id);

    });

}


function curtir(id){

    dados[id].curtiu = !dados[id].curtiu;

    dados[id].likes += dados[id].curtiu ? 1 : -1;

    salvar();

    mostrar();

}


function comentar(id){

    let txt = document.getElementById('in'+id).value;

    if(!txt) return;

    dados[id].comentarios.push(txt);

    document.getElementById('in'+id).value = '';

    salvar();

    mostrarComentarios(id);

}


function mostrarComentarios(id){

    let div = document.getElementById('lista'+id);

    if(!div) return;

    div.innerHTML = '';

    dados[id].comentarios.forEach(c => {

        div.innerHTML += `<div class="comment">${c}</div>`;

    });

}


function compartilhar(titulo){

    let url = window.location.href;

    if(navigator.share){

        navigator.share({title:'SAGC', text:titulo, url:url});

    } else {

        alert('Link: ' + url);

    }

}

</script>

</body>

</html>
